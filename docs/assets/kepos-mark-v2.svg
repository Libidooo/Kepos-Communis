<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Kepos Communis mark</title>
  <desc id="desc">Eight tapered square tables forming a shared ring.</desc>
  <g fill="#0B2744">
    <!-- Each tapered table is a small shared surface. Eight tables reference the eight-hour workday. -->
    <path d="M123 15 L133 15 L137 29 L119 29 Z"/>
    <path d="M179 34 L186 41 L176 52 L163 39 Z"/>
    <path d="M222 83 L222 93 L208 97 L208 79 Z"/>
    <path d="M222 139 L222 149 L208 153 L208 135 Z"/>
    <path d="M179 215 L186 208 L176 197 L163 210 Z"/>
    <path d="M123 241 L133 241 L137 227 L119 227 Z"/>
    <path d="M77 215 L70 208 L80 197 L93 210 Z"/>
    <path d="M34 139 L34 149 L48 153 L48 135 Z"/>
    <path d="M34 83 L34 93 L48 97 L48 79 Z"/>
    <path d="M77 34 L70 41 L80 52 L93 39 Z"/>
  </g>
  <!-- quiet inner orbit keeps the mark legible at small sizes -->
  <circle cx="128" cy="128" r="81" fill="none" stroke="#0B2744" stroke-opacity="0.16" stroke-width="2" stroke-dasharray="1 13" stroke-linecap="round"/>
</svg>
