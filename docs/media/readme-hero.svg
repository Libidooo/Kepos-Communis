  </g>
  <g fill="#B52F3B">
    <use href="#quarter"/><use href="#quarter" transform="rotate(90 940 257)"/>
    <use href="#quarter" transform="rotate(180 940 257)"/><use href="#quarter" transform="rotate(270 940 257)"/>
  </g>
  <circle cx="940" cy="257" r="51" fill="#F5F0E7" stroke="#B52F3B" stroke-width="1.5"/>
  <circle cx="940" cy="237" r="5" fill="#B52F3B"/>
  <text x="940" y="269" text-anchor="middle" fill="#B52F3B" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="23" font-weight="700">判断</text>
  <text x="940" y="293" text-anchor="middle" fill="#6A5E52" font-family="Consolas, 'Liberation Mono', monospace" font-size="9" letter-spacing="1">STAYS WITH YOU</text>
  <g font-family="Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="1" fill="#6A5E52">
    <text x="940" y="137" text-anchor="middle" fill="#B52F3B" font-size="22" letter-spacing="0" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">48 个代表席</text>
    <text x="940" y="396" text-anchor="middle">COUNCIL / 48 SEATS</text>
    <text x="56" y="498">01 / PURPOSE</text>
    <text x="412" y="498">02 / DIVISION OF WORK</text>
    <text x="815" y="498">03 / EVIDENCE &amp; REPORTS</text>
    <text x="1224" y="498" text-anchor="end" fill="#B52F3B">K / C</text>
  </g>
</svg>
