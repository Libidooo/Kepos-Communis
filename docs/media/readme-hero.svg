      <use href="#seat" transform="rotate(60 968 210)"/><use href="#seat" transform="rotate(67.5 968 210)"/>
      <use href="#seat" transform="rotate(75 968 210)"/><use href="#seat" transform="rotate(82.5 968 210)"/>
    </g>
  </defs>
