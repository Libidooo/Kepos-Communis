      <use href="#seat" transform="rotate(15 968 210)"/><use href="#seat" transform="rotate(22.5 968 210)"/>
      <use href="#seat" transform="rotate(30 968 210)"/><use href="#seat" transform="rotate(37.5 968 210)"/>
