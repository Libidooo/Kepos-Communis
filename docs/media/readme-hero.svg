<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
  <title id="title">Kepos Communis · 一位总理 Agent，48 个代表席</title>
  <desc id="desc">深墨底与暖纸白双色横幅。左侧为 Kepos Communis 字标和“让效率回到人的目的”；右侧四十八个独立朱红席位围绕数字48。下方说明人、总理、代表与Worker的分工。这是产品展示，非运行截图。</desc>
  <defs>
    <g id="seat"><path d="M963 44h10l3 14h-16z"/></g>
    <g id="quadrant">
