name: Verify Kepos
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run
      - if: runner.os == 'Windows'
        run: npm install --no-save --ignore-scripts --no-audit @earendil-works/pi-tui@1.4.0 @earendil-works/pi-ai@1.4.0
      - if: runner.os == 'Windows'
        run: npm run test:legacy
      - if: runner.os == 'Windows'
        run: npm run test:terminal:sdk
