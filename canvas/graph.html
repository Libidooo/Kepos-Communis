<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kepos Graph Canvas</title>
<style>
:root{--paper:#d2cabb;--muted:#a5a79d;--dim:#858d87;--amber:#c5a575;--teal:#8eb5ad;--sage:#a5b58d;--rust:#cd9585;--line:#536562;--bg:#1d2422;--card:#28312e;--selected:#354743}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 10%,#354743 0,#1d2422 42%);color:var(--paper);font:14px/1.45 "Cascadia Code","Microsoft YaHei UI",monospace;min-height:100vh;overflow:hidden}.shell{display:grid;grid-template-rows:72px 1fr;height:100vh}.bar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid #53656288;background:#1d2422e8;backdrop-filter:blur(10px)}.brand{letter-spacing:.22em;color:var(--amber);font-weight:700}.sub{color:var(--muted);font-size:11px;letter-spacing:.08em}.controls{display:flex;gap:8px}.button,.file{border:1px solid var(--line);background:#28312e;color:var(--paper);padding:8px 12px;border-radius:5px;cursor:pointer}.button:hover,.file:hover{border-color:var(--amber);color:var(--amber)}.workspace{position:relative;overflow:auto;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:32px 32px}.viewport{position:relative;min-width:1100px;min-height:800px;padding:60px}.edges{position:absolute;inset:0;pointer-events:none}.edge{stroke:var(--line);stroke-width:2;fill:none;stroke-dasharray:5 5}.edge.active{stroke:var(--amber);animation:dash 1.3s linear infinite}@keyframes dash{to{stroke-dashoffset:-20}}.node{position:absolute;width:270px;min-height:120px;padding:16px;border:1px solid var(--line);border-radius:8px;background:linear-gradient(145deg,#28312ef4,#202927f4);box-shadow:0 14px 30px #0005;transition:transform .18s,border-color .18s}.node:hover{transform:translateY(-3px);border-color:var(--amber)}.node h3{margin:0 0 8px;font-size:14px;color:var(--paper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.node .kind{color:var(--teal);font-size:10px;text-transform:uppercase;letter-spacing:.14em}.state{display:inline-block;margin-top:10px;padding:3px 7px;border-radius:12px;font-size:10px}.queued,.waiting{color:var(--amber);background:#514735}.running{color:var(--teal);background:#293f3d}.succeeded{color:var(--sage);background:#29352e}.failed,.needs_human{color:var(--rust);background:#3c2e2a}.error,.checkpoint{margin-top:8px;color:var(--muted);font-size:11px;max-height:34px;overflow:hidden}.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:16px}.legend{position:fixed;left:24px;bottom:18px;color:var(--muted);font-size:11px}.legend span{margin-right:16px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.dot.a{background:var(--amber)}.dot.t{background:var(--teal)}.dot.s{background:var(--sage)}.dot.r{background:var(--rust)}
</style></head>
<body><div class="shell"><header class="bar"><div><div class="brand">◌ KEPOS / GRAPH CANVAS</div><div class="sub" id="meta">Load a GraphStore export · React Flow compatible data contract</div></div><div class="controls"><label class="file">Load JSON<input id="file" type="file" accept="application/json" hidden></label><button class="button" id="fit">Fit graph</button></div></header><main class="workspace" id="workspace"><div class="viewport" id="viewport"><svg class="edges" id="edges"></svg><div class="empty" id="empty">Choose a graph JSON export to begin.</div></div></main></div><div class="legend"><span><i class="dot a"></i>queued / attention</span><span><i class="dot t"></i>running</span><span><i class="dot s"></i>complete</span><span><i class="dot r"></i>failed</span></div>
<script>
const file=document.querySelector('#file'),viewport=document.querySelector('#viewport'),edges=document.querySelector('#edges'),empty=document.querySelector('#empty'),meta=document.querySelector('#meta'),workspace=document.querySelector('#workspace');let graph=null;
function stateClass(state){return String(state||'queued').toLowerCase().replace(/[^a-z_]/g,'_')}
function render(data){graph=data;document.querySelectorAll('.node').forEach(node=>node.remove());edges.innerHTML='';empty.style.display='none';const map=new Map();for(const n of data.nodes||[]){const el=document.createElement('article');el.className='node';el.style.left=(n.position?.x||0)+'px';el.style.top=(n.position?.y||0)+'px';el.innerHTML=`<div class="kind">${n.data?.kind||'agent'}</div><h3>${escapeHtml(n.data?.label||n.id)}</h3><span class="state ${stateClass(n.data?.state)}">${escapeHtml(n.data?.state||'QUEUED')}</span>${n.data?.profileRevision?`<div class="checkpoint">profile ${escapeHtml(n.data.profileRevision.slice(0,10))}</div>`:''}${n.data?.checkpoint?`<div class="checkpoint">checkpoint ${escapeHtml(n.data.checkpoint)}</div>`:''}${n.data?.error?`<div class="error">${escapeHtml(n.data.error)}</div>`:''}`;viewport.appendChild(el);map.set(n.id,el)}requestAnimationFrame(()=>{const box=viewport.getBoundingClientRect();for(const e of data.edges||[]){const from=map.get(e.source),to=map.get(e.target);if(!from||!to)continue;const a=from.getBoundingClientRect(),b=to.getBoundingClientRect();const x1=a.left-box.left+a.width,y1=a.top-box.top+a.height/2,x2=b.left-box.left,y2=b.top-box.top+b.height/2;const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',`M ${x1} ${y1} C ${x1+80} ${y1}, ${x2-80} ${y2}, ${x2} ${y2}`);path.setAttribute('class','edge '+(e.animated?'active':''));edges.appendChild(path)}edges.setAttribute('width',viewport.scrollWidth);edges.setAttribute('height',viewport.scrollHeight)});meta.textContent=`${data.run?.goal||'run'} · ${data.run?.state||'UNKNOWN'} · ${(data.nodes||[]).length} nodes · ${(data.edges||[]).length} edges`}
function escapeHtml(text){return String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
file.addEventListener('change',async e=>{const selected=e.target.files?.[0];if(!selected)return;render(JSON.parse(await selected.text()))});document.querySelector('#fit').addEventListener('click',()=>{workspace.scrollTo({left:0,top:0,behavior:'smooth'})});
</script></body></html>
